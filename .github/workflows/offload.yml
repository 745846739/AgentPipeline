# 重活外发(票 runner-offload/04/06):把确定性重活(cargo test / clippy / 构建)从
# 106(2核/1GB/40G)搬到 GitHub hosted runner(4 核 16GB,公仓标准档免费)。
#
# 形态由共识钉死:
#   · 输入 = 分支名 + commit SHA + 一条白名单命令——**只外发已提交状态**,未提交改动
#     不外发;命令白名单(cargo test / clippy / build 前缀,无组合符)是工具层的**防注入面**
#     (票 06),工作流侧不重复校验——能走到这里的调用者已经过了那道闸;
#   · 结果只回**文本**(退出码 + 日志),不回传任何产物——106→GitHub 实测约 197KB/s,
#     73MB 二进制要 6 分钟以上,「只取结果」是共识决策;
#   · 不碰 secrets(与 check.yml 同一姿态:默认门不打真网络,决策 142/194)。
#
# 触发者是 106 上的 agent(offload_run 工具,票 06):`gh workflow run` + `gh run list`
# 轮询读结果。触发者没有凭据/排队超时/拉取失败时在工具层回退本机执行并留痕(票 06)。
name: offload

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '已推送的分支名(kanban/<task> 或 main)'
        required: true
      sha:
        description: '要验证的 commit SHA'
        required: true
      command:
        description: '白名单命令(cargo test / cargo clippy / cargo build 前缀)'
        required: true

# 同一分支只留最新一轮外发:agent 侧是串行循环,过期的验证没有意义。
concurrency:
  group: offload-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 与 check.yml 同一套环境钉法(决策 175 / 330 的理由全文见那边的注释,不复制)。
  RUSTUP_TOOLCHAIN: "1.98.0"
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  run:
    name: offload(${{ inputs.command }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OFFLOAD_SHA: ${{ inputs.sha }}
      OFFLOAD_COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      # 只验证已提交状态：分支尖端必须就是工具交来的那个 commit——push 与 dispatch
      # 之间分支又动了的话，这里替工具层把它拦下（工具层轮询也按 sha 对账，双保险）。
      # inputs 经 env 间写（评审 P2-3）：workflow_dispatch 可人手触发，直插 run: 的
      # inputs 是 GH 官方点名的注入写法。
      - name: 核对 SHA
        run: |
          got="$(git rev-parse HEAD)"
          echo "expected=$OFFLOAD_SHA got=$got"
          [ "$got" = "$OFFLOAD_SHA" ] || { echo "SHA 不一致:外发对象已漂移" >&2; exit 1; }
      # cache-on-failure(决策 346):外发失败轮的编译进度不作废——外发的对象恰恰
      # 是「可能红」的中间态,这条比在 check.yml 里更关键。
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # 缓存按分支隔离:kanban 分支各自的增量互不污染。
          prefix-key: offload-${{ inputs.branch }}
      - run: rustup component add clippy rustfmt
      - id: command
        run: ${{ env.OFFLOAD_COMMAND }}
      - if: always()
        name: 结果落 summary(文本回传的载体)
        run: |
          {
            echo "## offload($OFFLOAD_COMMAND)"
            echo "- ref: \`$OFFLOAD_SHA\`(@ ${{ inputs.branch }})"
            echo "- 结论: ${{ steps.command.outcome == 'success' && '✅ 通过' || '❌ 失败' }}"
          } >> "$GITHUB_STEP_SUMMARY"
