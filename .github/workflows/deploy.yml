# push 到 main 即部署到 106（也支持 Actions 页手动 workflow_dispatch）。
# 流水线：构建前端 dist → cargo release 构建（dist 被 build.rs 内嵌进单二进制）
#         → ssh 上传二进制（服务器预检版本可执行，glibc 不兼容当场失败、不碰现役服务）
#         → 服务器端安装、重启 systemd、健康检查。
# 密钥与主机信息全部走 repo secrets（SSH_PRIVATE_KEY / SSH_KNOWN_HOSTS / DEPLOY_HOST /
# DEPLOY_USER）；服务器端 sudoers 仅放行 /opt/deploy.sh 的 upload|deploy 两个子命令，
# CI 专用密钥不能登 shell 做别的——见 deploy 用户与 /etc/sudoers.d/deploy-pipeline。
name: deploy-106

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-106
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

      # 工具链取 rust-toolchain.toml 钉死的 1.98.0，带构建缓存
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build backend
        run: cargo build --release

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      # 跨境 SSH（Azure 出口 → 大陆云主机）会在握手阶段静默挂死：
      # OpenSSH 默认 IPQoS 标记的包会被部分跨境链路丢弃，IPQoS=cs0 规避；
      # 全部 ssh 命令配 ConnectTimeout/ServerAlive + timeout 包裹，快速失败不挂 25 分钟。
      - name: SSH smoke test
        run: |
          timeout 30 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IPQoS=cs0 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'echo CONN_OK'

      - name: Upload binary
        # 跨境链路对 SSH 大流量会掐断：二进制 gzip 后传（31MB→9MB），服务端回传
        # sha256 做完整性校验，超时/校验不过自动重试（最多 5 次）。
        run: |
          LOCAL_SHA=$(sha256sum target/release/agent-pipeline | cut -d' ' -f1)
          for i in 1 2 3 4 5; do
            echo "upload attempt $i"
            if OUT=$(timeout 300 sh -c 'gzip -9 -c target/release/agent-pipeline | ssh -i ~/.ssh/deploy_key \
                -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=4 -o IPQoS=cs0 \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                "sudo -n /opt/deploy.sh upload"' 2>&1); then
              REMOTE_SHA=$(printf '%s\n' "$OUT" | grep -E '^[0-9a-f]{64}$' | tail -1 || true)
              if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
                echo "upload verified: $REMOTE_SHA"
                exit 0
              fi
              echo "sha mismatch (remote=${REMOTE_SHA:-none})"
            else
              printf '%s\n' "$OUT" | tail -3
              echo "attempt $i timed out or errored"
            fi
            sleep 5
          done
          exit 1

      - name: Deploy and verify
        run: |
          timeout 120 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IPQoS=cs0 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo -n /opt/deploy.sh deploy"
