# push 到 main 即部署到 106（也支持 Actions 页手动 workflow_dispatch）。
#
# 拓扑：CI 不在 runner 上构建、也不传二进制过境——跨境大流量双向实测都被掐
#   （runner→106 推 9.4MB gzip 五次重试全挂；106→GitHub 直接拉大文件仅 14–31KB/s；
#    而 106 git fetch 源码小增量 7 秒完成、SSH 小指令一直稳定）。
# 所以 CI 只发一条 SSH 小指令，106 自己 git pull + 本地重建（源码增量不过境）
# + 重启 systemd + 健康检查，CI 轮询 /opt/deploy.sh status 到终态。
# 密钥与主机信息全部走 repo secrets（SSH_PRIVATE_KEY / SSH_KNOWN_HOSTS / DEPLOY_HOST /
# DEPLOY_USER）；服务器端 sudoers 仅放行 /opt/deploy.sh 的 start|status 两个子命令，
# CI 专用密钥不能登 shell 做别的——见 deploy 用户与 /etc/sudoers.d/deploy-pipeline。
name: deploy-106

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-106
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 跨境 SSH（Azure 出口 → 大陆云主机）对默认 QoS 标记的包会丢：
      # IPQoS=cs0 规避；ConnectTimeout/ServerAlive + timeout 包裹，快速失败不挂死。
      # 配置集中写进 ~/.ssh/config，下面的步骤都用 Host deploy106。
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          {
            echo "Host deploy106"
            echo "  HostName ${{ secrets.DEPLOY_HOST }}"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 4"
            echo "  IPQoS cs0"
          } >> ~/.ssh/config

      - name: SSH smoke test
        run: timeout 30 ssh deploy106 'echo CONN_OK'

      - name: Trigger rebuild on 106
        run: timeout 30 ssh deploy106 'sudo -n /opt/deploy.sh start'

      # 106 上本地重建约 8–12 分钟（前端 dist + cargo release，CARGO_BUILD_JOBS=2 防 OOM）。
      # 状态文件是唯一真相；单次轮询若 ssh 抖动只记警告继续，不因瞬时网络失败误判。
      - name: Poll rebuild status
        run: |
          for i in $(seq 1 100); do
            if OUT=$(timeout 30 ssh deploy106 'sudo -n /opt/deploy.sh status' 2>&1); then
              STATE=$(printf '%s\n' "$OUT" | grep -m1 '^state=' | cut -d= -f2 || true)
              echo "poll $i: state=${STATE:-unknown}"
              case "$STATE" in
                success)
                  echo "rebuild verified on 106"
                  exit 0
                  ;;
                failed)
                  printf '%s\n' "$OUT"
                  exit 1
                  ;;
              esac
            else
              echo "poll $i: ssh transient failure"
              printf '%s\n' "$OUT" | tail -3
            fi
            sleep 15
          done
          echo "rebuild did not reach terminal state in time"
          exit 1

      # 外部可达性检查（pwa-webpush 票 01 / 决策 327）：先试 https，明文那一支是**过渡期的回退**。
      #
      # 为什么两态并存：106 正在从「明文 3333」迁到「Caddy 443 + 后端只绑回环」，两态都会出现
      # （切换那一票落地前是明文，之后是 https）。这里问的是「服务活着吗」而不是「走的哪条路」，
      # 故任一条 200 即通过——**切换那一票落地时删掉明文那一支**，那时它就是「明文入口复活」的检测器。
      #
      # 证书是开发机 mkcert 自签的，runner 没有信任链：有 DEPLOY_CA_PEM（仓库 secret，放**根证书**
      # 而不是私钥）就用它验链，没有就退到 -k——信任链由设备那一侧验（手机装 CA 描述文件）。
      - name: External HTTPS check
        env:
          CA_PEM: ${{ secrets.DEPLOY_CA_PEM }}
        run: |
          VERIFY=(-k)
          if [ -n "$CA_PEM" ]; then
            mkdir -p "$HOME/.ca"
            printf '%s\n' "$CA_PEM" > "$HOME/.ca/rootCA.pem"
            VERIFY=(--cacert "$HOME/.ca/rootCA.pem")
          fi
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              "${VERIFY[@]}" "https://${{ secrets.DEPLOY_HOST }}/" || true)
            echo "attempt $i: https $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done

          # 过渡期回退：明文入口还在的形态。切换落地后删掉这一段。
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              "http://${{ secrets.DEPLOY_HOST }}:3333/" || true)
            echo "attempt $i: http(过渡期) $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          exit 1
