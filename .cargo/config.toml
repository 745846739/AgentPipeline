[build]
# 开发机是 4 线程（2 物理核）/ 8 GB 内存。cargo 默认并发会同时拉起 3–4 个
# rustc（每个 RSS 约 300–450 MB，峰值叠加 1.5 GB 上下），在 8 GB 机器上直接
# 触发内存压缩与换页，反而拖慢总吞吐。压到物理核数。
jobs = 2
# 增量编译（**决策 178 推翻了决策 175 的「保持关闭」**）。本仓的日常形态是
# 「改一处 → 跑一层」，而不是一次性全量构建；关掉它意味着**每次改动都要从头
# 重编整个 crate**。实测（本机 8 GB / 2 物理核，独立 target、同一份配置）：
#   改一个 core 文件 → core 单测    3m33s → 18s
#   改一个 core 文件 → 全量套件     9m59s → 1m35s
# 代价实测：峰值 rustc RSS 约 384 MB（jobs = 2 下同时最多两个，未触发换页）、
# 增量缓存约 0.5 GB 磁盘、swap 占用无显著增长——都在本机余量内。首次全量编译
# 会略慢（多写增量产物），属一次性成本。
incremental = true

# 注意：本文件**不放** [profile.*]（决策 175）。profile 的唯一事实源是根
# Cargo.toml —— config.toml 的 profile 会覆盖 Cargo.toml，两处各写一半时，
# 任何一处被改动都会改变**整棵依赖树**的 profile 指纹，从而触发全量重编
# （本机实测约 10–16 分钟）。看 profile 设置请直接看 Cargo.toml。
#
# 也不放 [env] RUSTUP_TOOLCHAIN：cargo **明确禁止**该键（实测报 "setting the
# `RUSTUP_TOOLCHAIN` environment variable is not supported in the `[env]`
# configuration table"）——它要先于配置读出来才能选中工具链，属先有鸡后有蛋。
# 故工具链钉住只能放在 Makefile 的 export（见那里；这是本仓要求经 make 跑闸门的
# 原因之一，裸 `cargo test` 会踩到依赖自带的 rust-toolchain.toml）。
