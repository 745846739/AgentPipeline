# 工具链固定（决策 175）：本机有两套 rust —— /opt/local/bin（MacPorts 自带）排在
# ~/.cargo/bin（rustup）之前，裸 `cargo` 会落到 MacPorts 那套上。两套 rustc 的
# `-vV` 输出不同（MacPorts 多一句 "built from a source tarball"），cargo 的 rustc
# 指纹因此不同 —— 换一套就意味着**整棵依赖树重编**。
#
# 这里**钉死具体版本号，不用 `stable`**：`stable` 是移动通道，rustup 的 shim 会按
# update-hash 周期拉最新 manifest 并**就地替换**该工具链。实测（2026-09-15）它在
# `make check-test` 跑到一半时把 stable 从 1.98.0 升到 1.98.1，正在编的 crate 当场
# 报 E0514 / "rustc binary not applicable to the toolchain" —— 正是本决策要消除的
# 全量重编，且以闸门中断的形式出现。写成精确版本后 rustup 不再更新该工具链。
#
# **本文件不足以钉住工具链**（实测第二次闸门失败）：rustup 的 shim 按**当前目录**
# 查找 rust-toolchain.toml，而 cargo 编译第三方 crate 时的工作目录是
# ~/.cargo/registry/src/.../{crate}/ —— 那些 crate **自带** rust-toolchain.toml
# （实测 atoi 2.0.0 钉 1.57.0、sqlx 0.8.6 钉 1.78）。于是编到 atoi 时 rustup 当场
# 下载并切到 rustc 1.57.0，而 1.57 不认识 cargo 传的 `--check-cfg`，报
# `Unrecognized option: 'check-cfg'` 直接失败。**真正的钉法是 Makefile 里的
# `export RUSTUP_TOOLCHAIN`**（优先级高于目录文件）；本文件是给编辑器 / 裸 cargo
# 用的第二道防线，别单独依赖它。cargo 的 `[env]` 表**不能**承担此职（cargo 明确
# 禁止 RUSTUP_TOOLCHAIN 落在那张表里）。
#
# 仍不是万能：直接调用 MacPorts 的 /opt/local/bin/cargo 会绕过 rustup（MacPorts
# 不读本文件），故 Makefile 同时把 ~/.cargo/bin 提到 PATH 最前。
#
# `components`（决策 330）：闸门要用的两个工具显式声明，不靠 rustup 默认 profile 带进来。
# 注意它**管不到 Makefile / CI 那条路**——RUSTUP_TOOLCHAIN 一定，rustup 就完全不读本文件
# （见上），故 CI 的 lint job 另有一条 `rustup component add clippy rustfmt`。这里这一行
# 是给编辑器与裸 `cargo` 用的。
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
