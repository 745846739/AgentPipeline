<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`（决策 282 ④）：安卓 Chrome/WebView 聚焦输入框时
         键盘压缩的是**版面**而不是叠在版面上的浮层——钉底的输入坞不再被键盘压住。
         iPhone 不认这一键，由 WebKit 自理（键盘本就压缩版面）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- 主屏幕 standalone（决策 282 ④）：从主屏幕图标打开即为独立窗口——Safari 的地址栏与
         底栏整体让位，看板 / 详情 / 对讲台全站受益。与桌面壳（WKWebView）无涉：壳内本就没有
         浏览器 chrome，这些 meta 在壳里是惰性的。
         · 图标与桌面壳同一份母版（scripts/make-icon.mjs 生成，改图改那里重跑）：apple-touch
           与 maskable 用满幅底那份——iOS 不认透明，桌面版的透明四角会露黑角；
         · status-bar-style 取 black（实心黑）而不是 black-translucent：仓里只有底部安全区
           基建（--safeb），黑透明会把顶栏压进刘海，那是另一笔账；
         · iOS 主屏 web app 与 Safari 存储隔离，配对令牌靠图标记下的 `?pair=` 地址（决策 191），
           换过令牌要重新添加一次——这句提醒住在对讲台的配对指引里。 -->
    <!-- `?v=2`（决策 285）：manifest 曾被服务器按「带哈希产物」发成一年期 `immutable`，那段时间
         取走过旧副本的设备会把它一直用下去——旧副本里有 `start_url`，会顶掉主屏图标的启动地址，
         连「重新添加一次」都救不回来（iOS 主屏容器与 Safari 存储隔离，令牌只能靠那条地址递进去，
         决策 191）。改查询串就是换一条地址，逼这些设备重新取一份；`index.html` 本身是
         `no-cache`，新查询串必定被看见。服务器那边已按 285 把 manifest 改回 `no-cache`，
         **往后改 manifest 不必再动这里**——这个参数只为换掉已经发出去的那些旧副本。 -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#1b1d2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AgentPipeline" />
    <link rel="apple-touch-icon" href="/icons/icon-maskable-192.png" />
    <title>AgentPipeline · 像素机房</title>
    <script>
      // 深浅两套像素主题：本地记忆，避免首屏闪回深色（决策 169，键名沿用既有约定）
      try {
        var t = localStorage.getItem('agentpipeline.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme =
          document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
    <!-- 缝合像素 12px 等宽：自托管 78 个 woff2 子集（同源 /fonts/…），随 dist 内嵌进
         单二进制（决策 155 / 169）。font-display: block——字体本地加载毫秒级，
         不让像素身份走「先 monospace 再换」。 -->
    <link rel="stylesheet" href="/fonts/fusion-pixel-12px/fusion-pixel-12px.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
