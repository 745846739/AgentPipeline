[package]
name = "agentpipeline-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AgentPipeline 核心库：pipeline / agent / storage / scheduler / git"

[dependencies]
anyhow.workspace = true
# Web Push 的三件密码学原语（票 pwa-webpush 02，`src/webpush.rs`）：P-256 的 ECDH 与
# ECDSA、AES-128-GCM、HKDF-SHA256。**零新依赖**——ring 早就在依赖树里（reqwest 的
# rustls-tls 传递依赖），提为直接依赖只多一条 Cargo.lock 边；base64 同（0.22 已在树里）。
# 不引 `web-push` 之类的整包：本票要的只是「RFC 8291 的密钥派生 + 一节 aes128gcm 记录」，
# 自写才能拿 RFC 的公开测试向量把每一段钉住（票 02 判据）。
ring.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
git2.workspace = true
# 存储水位读数（决策 321）：statvfs 读磁盘剩余空间。
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
zip.workspace = true

[dev-dependencies]
insta.workspace = true
# 迁移用例要用**原始 SQL** 造一份「还没升到 0012 的旧库」（决策 204：在既有数据上打开
# 不炸是这次迁移的硬要求），而那条路必须绕过 Store::open（它会跑全量迁移）。
sqlx.workspace = true
tempfile.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
