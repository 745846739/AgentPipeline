[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/testkit",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
# Web Push 的 base64url 无填充编解码（票 pwa-webpush 02）：0.22 已在依赖树里
# （rustls 一带的传递依赖），提为直接依赖不引新下载。
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
git2 = "0.20"
insta = { version = "1", features = ["json"] }
regex = "1"
# Web Push 的三件密码学原语（票 pwa-webpush 02）：P-256 的 ECDH/ECDSA、AES-128-GCM、
# HKDF-SHA256。同上——ring 0.17 已在依赖树里（reqwest 的 rustls-tls）。
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
# 响应压缩（决策 361，票 01）：本仓此前**完全没有压缩**——106 上 `/tasks/{id}/commands`
# 的 1,330,415 字节是原样过网的（实测响应头只有 content-type + content-length）。
# 只开 br / gzip 两个 feature：deflate 与 zstd 在浏览器端的收益与 br 重叠，
# 多一份编解码依赖换不到载荷上的差别。
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
# 存储水位读数用（决策 321）：statvfs 拿磁盘剩余空间。libc 已在依赖树里
# （sqlite / tokio 的传递依赖），提为直接依赖不加编译成本。
libc = "0.2"
# 应用内 TLS 终止（决策 335）：106 上不再要 Caddy，服务自己收 https。
# rustls / tokio-rustls 同样**已在依赖树里**（reqwest 的 rustls-tls 传递依赖），
# 提为直接依赖不引新下载；PEM 解析走 rustls 自带的 pki-types，不另引 rustls-pemfile。
#
# **必须关掉默认特性**：两者的默认都选 aws-lc-rs 这一套加密后端，而树里那份是用
# `ring` 编的（reqwest 的 `__rustls-ring`）。不关默认 = 凭空拉进 aws-lc-rs（还带 C
# 工具链构建），锁文件里现在没有它，本机与 106 都要多付一次全量编译。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# 技能包（zip）解码（票 09）：**只用它读，不用它写**，故关掉默认特性集
# （aes-crypto / bzip2 / zstd / lzma / ppmd / time 全是为压缩与加密准备的，本票用不到）。
# 保留 deflate——`zip -r` 的默认压缩方法，用户上传的包几乎都是它；
# `zlib-rs` 后端是纯 Rust，不引 C 工具链，避免给本机链接时间再加一笔。
# 路径穿越**不外包**给它的 `enclosed_name` 全权负责（票 09 的主要风险，见
# crates/core/src/agent/skill_import.rs）：它拒绝绝对路径与越界 `..`，但我们仍自己过一道
# 更严的判定，不把安全判定寄托在第三方库的实现细节上。
zip = { version = "4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

agentpipeline-core = { path = "crates/core" }
testkit = { path = "crates/testkit" }

# ── 编译 profile：本文件是唯一事实源（决策 175）────────────────────────────
#
# 为什么集中在 Cargo.toml 而不再放 .cargo/config.toml：config.toml 里的
# `[profile.*]` 虽然生效，但它与 Cargo.toml 的 profile 是两个来源；两边各写一半
# 时，任何一边被编辑都会让**整棵依赖树**换一个 profile 哈希而全量重编。
# 本机只有 2 物理核，一次整树重编 = 10 分钟以上，故此处的稳定性直接决定闸门耗时。
#
# `debug = "line-tables-only"`：保留 panic 回溯的文件名 + 行号（测试失败仍可定位），
# 去掉类型级调试信息——后者是 rustc 内存占用与链接时间的大头。
# dev 与 test 两个 profile 必须保持**完全一致**：默认 dev 不带 opt-level 而 test 带
# opt-level = 1，两者不同就会出现「dev 编一份依赖、test 再编一份」的双份编译。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.test]
opt-level = 1
debug = "line-tables-only"

# 第三方依赖不生成调试信息。调试信息只服务于「读我们自己的代码报错栈」，
# 而依赖里出现 panic 时，行号对齐 libc/openssl 之类没有实际收益；关掉它同时
# 缩小 rlib（链接输入）与缩短链接时间——本机的链接时间占总耗时很大一块。
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
